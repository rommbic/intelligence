name: Intel Refresh

# The DASHBOARD refreshes every 3 hours, fully unattended.
# The EMAIL digest is sent once a day (the 06:30 run only), so consultants get
# one morning summary while the dashboard stays fresh through the day.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours -> dashboard refresh (no email)
    - cron: "30 6 * * *"    # 06:30 UTC daily -> refresh + email digest
  workflow_dispatch: {}     # manual run (also sends email)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: intel-refresh
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run intelligence agent
        env:
          # Manual "Run workflow" => force-send a digest now (for testing).
          # Scheduled runs => leave unset, so the agent decides (sends once,
          # on the first run after the morning hour). This is what makes the
          # daily brief resilient to GitHub skipping a scheduled slot.
          FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DASHBOARD_URL:     ${{ secrets.DASHBOARD_URL }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          CH_API_KEY:        ${{ secrets.CH_API_KEY }}
          USE_CLAUDE:        ${{ secrets.USE_CLAUDE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Outreach (Loxo -> Gmail drafts). Safe to leave unset while
          # outreach.enabled is false in settings.yaml.
          LOXO_API_KEY:            ${{ secrets.LOXO_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          OUTREACH_INBOX:          ${{ secrets.OUTREACH_INBOX }}
        run: python -m src.main

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp -r data/* _site/data/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Persist data on EVERY run. This is essential: the email-sent marker
      # (data/email_state.json) must survive between runs, otherwise the agent
      # would forget it already emailed today and could send again. Also keeps
      # the schedule alive and builds the dashboard history archive.
      - name: Persist data
        run: |
          git config user.name  "rommbic-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data
          git commit -m "intel: $(date -u +'%F %H:%M')" || echo "no changes to commit"
          git push || echo "push skipped"
