name: Loxo Preflight (one-off)

# Manually-triggered inspection of your Loxo account. Prints the raw JSON
# structure of a company and its linked people so we can see the exact field
# names in your account before building the outreach automation.
# Safe: read-only, redacts names/emails in the printed output.

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company name to look up (must exist in your Loxo)"
        required: false
        default: "Marshalls"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Run preflight
        env:
          LOXO_API_KEY: ${{ secrets.LOXO_API_KEY }}
          PREFLIGHT_COMPANY: ${{ github.event.inputs.company }}
        run: python tools/loxo_preflight.py
